name: CI

on:
  push:
    branches: [ main, development ]
  pull_request:
    branches: [ main, development ]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: ${{ secrets.MYSQL_DATABASE }}
      DB_USERNAME: ${{ secrets.MYSQL_USER }}
      DB_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
          MYSQL_DATABASE: ${{ secrets.MYSQL_DATABASE }}
          MYSQL_USER: ${{ secrets.MYSQL_USER }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          extensions: mbstring, xml, pdo_sqlite, ctype, json, tokenizer, fileinfo, openssl

      - name: Get Composer Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.composer/cache
            vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install PHP dependencies
        run: composer install --no-progress --no-suggest --prefer-dist --no-interaction

      - name: Setup Node.js (for npm)
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install node dependencies (try `npm ci`, fallback to `npm install`)
        run: |
          npm ci || npm install

      - name: Prepare environment (.env + APP_KEY)
        env:
          DB_CONNECTION: mysql
          DB_HOST: ${{ env.DB_HOST }}
          DB_PORT: ${{ env.DB_PORT }}
          DB_DATABASE: ${{ env.DB_DATABASE }}
          DB_USERNAME: ${{ env.DB_USERNAME }}
          DB_PASSWORD: ${{ env.DB_PASSWORD }}
        run: |
          cp .env.example .env
          sed -i "s/^DB_CONNECTION=.*/DB_CONNECTION=${DB_CONNECTION}/" .env || true
          sed -i "s/^DB_HOST=.*/DB_HOST=${DB_HOST}/" .env || true
          sed -i "s/^DB_PORT=.*/DB_PORT=${DB_PORT}/" .env || true
          sed -i "s/^DB_DATABASE=.*/DB_DATABASE=${DB_DATABASE}/" .env || true
          sed -i "s/^DB_USERNAME=.*/DB_USERNAME=${DB_USERNAME}/" .env || true
          sed -i "s/^DB_PASSWORD=.*/DB_PASSWORD=${DB_PASSWORD}/" .env || true
          php artisan key:generate --ansi

      - name: Wait for MySQL to be ready
        env:
          DB_HOST: ${{ env.DB_HOST }}
          DB_PORT: ${{ env.DB_PORT }}
          DB_DATABASE: ${{ env.DB_DATABASE }}
          DB_USERNAME: ${{ env.DB_USERNAME }}
          DB_PASSWORD: ${{ env.DB_PASSWORD }}
        run: |
          php -r '
          $tries = 0;
          $max = 60;
          $host = getenv("DB_HOST") ?: "127.0.0.1";
          $port = getenv("DB_PORT") ?: 3306;
          $db = getenv("DB_DATABASE") ?: "test";
          $user = getenv("DB_USERNAME");
          $pass = getenv("DB_PASSWORD");
          while (true) {
              try {
                  new PDO("mysql:host={$host};port={$port};dbname={$db}", $user, $pass);
                  echo "MySQL is ready\n";
                  break;
              } catch (Exception $e) {
                  if (++$tries > $max) { echo "MySQL did not become ready\n"; exit(1); }
                  sleep(1);
              }
          }
          '

      - name: Run migrations
        run: php artisan migrate --force

      - name: Run tests
        run: composer test
